<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tollare → Stockholm · Reseplanerare</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111823; --panel2:#0e141d; --line:#1e293b;
    --text:#e9eff7; --muted:#8497ad; --dim:#5b6b80;
    --ok:#33d17f; --warn:#f0b429; --bad:#ff7a3c; --crit:#ff4d5e; --accent:#4da3ff;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    position:relative;
  }

  /* ==== Fast format som skalas som en helhet ======================
     Tavlan ritas alltid i 1920×1080 och krymps med transform för att passa
     fönstret. Allt inuti behåller sina proportioner, så ingenting kan
     huggas av eller försvinna när fönstret blir mindre — texten blir bara
     mindre, precis som på en affisch.

     Tidigare skalade varje mått för sig mot fönstret. Då tog höjden slut i
     vänsterkolumnen och korten längst ner klipptes bort helt.

     Origo ligger i övre vänstra hörnet och centreringen görs med translate
     i scaleBoard(). Med origo i mitten skalades tavlan kring sin egen
     mittpunkt medan lådan låg kvar i hörnet, och resultatet hamnade nedåt
     höger med tomrum uppe till vänster.
     ================================================================ */
  #app{
    position:absolute; top:0; left:0;
    width:1920px; height:1080px;
    transform-origin:0 0;
    font-size:12px;
    display:flex; flex-direction:column; gap:8px; padding:12px 23px;
    box-sizing:border-box;
  }

  /* Bara uppdateringstiden — DAKboard har egen klocka och rubrik. */
  header{display:flex;justify-content:flex-end;flex:0 0 auto}
  .stamp{color:var(--muted);font-size:1em;text-align:right;line-height:1.3}
  .stamp b{color:var(--text);font-weight:600}
  .stale{color:var(--warn)} .err{color:var(--crit)}

  /* Banderollen sitter i kartkolumnen, ovanför kartan, och är därmed
     exakt lika bred som den. */
  .banner{flex:0 0 auto;border-radius:var(--r);padding:9.7px 19.2px;
    display:flex;align-items:center;gap:17.3px;border:1px solid var(--line);background:var(--panel)}
  .banner>div:last-child{min-width:0}
  .banner .dot{width:1.35em;height:1.35em;border-radius:50%;flex:0 0 auto;
    box-shadow:0 0 0 .3em rgba(255,255,255,.05)}
  .banner .btitle{font-size:1.4em;font-weight:700;letter-spacing:-.01em;line-height:1.2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .banner .bmsg{color:var(--muted);font-size:1.02em;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .banner.ok{border-color:rgba(51,209,127,.35);background:linear-gradient(90deg,rgba(51,209,127,.10),transparent 60%)}
  .banner.ok .dot{background:var(--ok)}
  .banner.warn{border-color:rgba(240,180,41,.45);background:linear-gradient(90deg,rgba(240,180,41,.12),transparent 60%)}
  .banner.warn .dot{background:var(--warn)}
  .banner.bad{border-color:rgba(255,122,60,.5);background:linear-gradient(90deg,rgba(255,122,60,.15),transparent 62%)}
  .banner.bad .dot{background:var(--bad)}
  .banner.crit{border-color:rgba(255,77,94,.6);background:linear-gradient(90deg,rgba(255,77,94,.18),transparent 65%)}
  .banner.crit .dot{background:var(--crit);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* Kartkolumnen får mer plats än ruttkolumnen — namnen behöver inte bredden. */
  main{flex:1 1 auto;display:grid;grid-template-columns:0.82fr 1fr;gap:17.3px;
    min-height:0;overflow:hidden}
  /* overflow:hidden är skyddsnätet: utan det målade en för hög vänsterkolumn
     rakt över kameraraden istället för att hålla sig i sin ruta. */
  .col{display:flex;flex-direction:column;gap:8.6px;min-height:0;overflow:hidden}

  .dest{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:9.2px 19.2px;display:flex;flex-direction:column;gap:4.9px;flex:0 0 auto}
  /* Korten får naturlig höjd. Tidigare tvingades de lika höga och klippte
     då bort sista rutten. Överbliven höjd hamnar i .spacer. */
  .spacer{flex:1 1 auto;min-height:0}
  .dest h2{margin:0;font-size:1.15em;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:.6em}
  .dest h2 .km{color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}

  .route{display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;
    column-gap:19.2px;row-gap:3.2px;align-items:center;padding:5.9px 3.8px;border-top:1px solid var(--line)}
  .route:first-of-type{border-top:0}
  .rname{font-size:1.22em;font-weight:600;display:flex;align-items:baseline;gap:.5em;min-width:0}
  /* Ruttnamnet bryts på två rader istället för att huggas av — hela namnet
     ska gå att läsa även i ett smalt fönster. */
  .rname span.txt{min-width:0;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .chip{font-size:.66em;font-weight:700;letter-spacing:.06em;padding:.2em .5em;border-radius:6px;flex:0 0 auto}
  .chip.best{background:rgba(51,209,127,.16);color:var(--ok);border:1px solid rgba(51,209,127,.4)}
  .chip.est{background:rgba(132,151,173,.14);color:var(--muted);border:1px solid rgba(132,151,173,.3)}
  .chip.blocked{background:rgba(255,77,94,.18);color:var(--crit);border:1px solid rgba(255,77,94,.5)}
  .eta{font-size:1.95em;font-weight:700;letter-spacing:-.02em;text-align:right;line-height:1;
    white-space:nowrap}
  .eta u{text-decoration:none;font-size:.42em;font-weight:500;color:var(--muted);margin-left:.25em}
  .delta{font-size:1.12em;font-weight:650;text-align:right;min-width:3.4em;white-space:nowrap}
  /* Varje delsträcka namnges i stapeln, annars går det inte att se vilken
     del av vägen som är röd. */
  .legbar{grid-column:1/-1;display:flex;gap:2px;height:20px;border-radius:5px;overflow:hidden}
  /* min-width ger korta sträckor plats för sitt namn — färjeöverfarterna är
     bara någon kilometer av en 70 km-rutt och fick annars bara "fä". */
  .legbar b{display:flex;align-items:center;justify-content:center;height:100%;
    min-width:3em;overflow:hidden;font-size:.92em;font-weight:700;
    color:#08111c;letter-spacing:.01em;padding:0 .25em}
  .legbar b span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Omätt: tydliga diagonalstreck så att grått inte förväxlas med "fri väg" */
  .legbar b.nodata{color:#93a4b8;background-image:repeating-linear-gradient(45deg,
    rgba(255,255,255,.14) 0 4px,rgba(255,255,255,0) 4px 9px)}

  /* ---------- bussavgångar ---------- */
  .destwrap{display:flex;flex-direction:column;gap:7.6px;flex:0 0 auto}
  /* Busskortet tar den höjd som blir kvar. min-height gör att det aldrig
     kan pressas till noll och försvinna — antalet rader anpassas istället
     av fitRows() efter hur mycket plats som faktiskt finns. */
  .dest.bus{flex:1 1 auto;min-height:5.5em;overflow:hidden}
  #buses{min-height:0;overflow:hidden}
  .bustop{font-size:1em;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;
    margin-top:3.8px;border-top:1px solid var(--line);padding-top:3.8px}
  #buses>.bustop:first-child{border-top:0;margin-top:0;padding-top:0}
  /* Fasta kolumnbredder — med auto blev vänsterkanten på hållplats- och
     punktlighetskolumnen ojämn rad för rad. */
  .busrow{display:grid;grid-template-columns:2.7em 1fr 5.4em 7.6em;gap:9.6px;
    align-items:center;font-size:1.14em;padding:1.5px 0}
  /* kronologisk lista: en kolumn extra för hållplatsen */
  #buses.merged .busrow{grid-template-columns:2.7em 1fr 9.4em 5.4em 7.6em}
  /* beräknad avgång stor, tidtabellen liten intill */
  .busrow .clock{text-align:right;white-space:nowrap;
    display:flex;align-items:baseline;justify-content:flex-end;gap:.4em}
  .busrow .clock b{font-weight:700;font-size:1.06em}
  .busrow .clock em{font-style:normal;color:var(--dim);font-size:.82em}
  .busrow .clock.soon b{color:var(--ok)}
  .busrow .hpl{color:var(--dim);font-size:.8em;text-transform:uppercase;
    letter-spacing:.05em;white-space:nowrap;text-align:left;
    overflow:hidden;text-overflow:ellipsis}
  /* Hemmahållplatsen lyfts fram — det är den du går till. Markeringen är
     tonplattan och det accentfärgade hållplatsnamnet; kantlinjen till
     vänster såg ut som en klammer och är borttagen. */
  .busrow.prim{background:rgba(77,163,255,.07);border-radius:5px}
  .busrow.prim .hpl{color:var(--accent);font-weight:700}
  .maperr{height:100%;display:grid;place-items:center;text-align:center;
    color:var(--muted);font-size:1.2em;line-height:1.5}
  .maperr small{color:var(--dim);font-size:.75em}
  .busrow .pt{font-size:.82em;font-weight:650;white-space:nowrap;text-align:right}
  .busrow .pt.ontime{color:var(--ok)}
  .busrow .pt.warn{color:var(--warn)}
  .busrow .pt.bad{color:var(--crit)}
  .busrow .pt.early{color:var(--accent)}
  .busrow .pt.plan{color:var(--dim);font-weight:400}
  .busrow .ln{background:#1d2a3a;color:#cfe4ff;font-weight:700;text-align:center;
    border-radius:5px;padding:.08em 0;font-size:.92em}
  .busrow .to{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .busrow .to i{color:var(--warn);font-style:normal;font-weight:700}
  .busrow .to u{text-decoration:none;font-size:.74em;font-weight:700;letter-spacing:.04em;
    color:var(--warn);border:1px solid rgba(240,180,41,.45);border-radius:4px;
    padding:.05em .3em;margin-left:.2em;vertical-align:.08em}
  .busrow.cancelled{opacity:.55}
  .busrow.cancelled .to{text-decoration:line-through}
  .busrow.cancelled .when{color:var(--crit)}
  .busmore{color:var(--dim);font-size:.95em;padding-top:1.1px}

  #map{flex:1 1 auto;min-height:216px;border-radius:var(--r);border:1px solid var(--line);background:#0e141d}
  /* Ortnamn när kartbild saknas */
  /* SVG-kartan */
  .mapsvg{display:block;width:100%;height:100%}
  .mapsvg text{pointer-events:none}
  text.placelbl{fill:#7b8ea6;font:500 11px/1 inherit;
    paint-order:stroke;stroke:#0a0e13;stroke-width:3px;stroke-linejoin:round}
  text.camnum{fill:#08111c;font:700 10px/1 inherit}
  text.mapattr{fill:#5b6b80;font:400 9px/1 inherit}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9.2px 19.2px;
    display:flex;flex-direction:column;gap:4.9px;min-height:0;flex:0 1 auto;overflow:hidden}
  .panel h3{margin:0 0 2.2px;font-size:1.05em;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.09em}
  /* Kartan behöver höjd för att inte bli en tunn remsa — ledlistan hålls kort. */
  #legpanel{flex:0 0 auto;max-height:162px}

  .legrow{display:grid;grid-template-columns:1.2em 1fr auto auto;gap:13.4px;align-items:center;
    font-size:1.12em;padding:1.9px 0}
  .legrow .pill{width:.75em;height:.75em;border-radius:50%}
  .legrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legrow .now{color:var(--dim);font-size:.85em;white-space:nowrap}
  .legrow .dl{font-weight:650;min-width:4.2em;text-align:right;white-space:nowrap}

  .empty{color:var(--dim);font-size:1.05em;padding:4.3px 0}

  .cams{flex:0 0 auto;height:205.2px;min-height:0;display:grid;
    grid-template-columns:repeat(6,1fr);gap:13.4px}
  .cam{position:relative;margin:0;border-radius:var(--r);overflow:hidden;
    border:1px solid var(--line);background:var(--panel2)}
  .cam img{width:100%;height:100%;object-fit:cover;display:block}
  .cam.dead img{display:none}
  .cam.dead::after{content:"bild saknas";position:absolute;inset:0;display:grid;
    place-items:center;color:var(--dim);font-size:1.05em}
  .camtag{position:absolute;top:6.5px;right:8.6px;color:#08111c;font-weight:700;
    font-size:.92em;padding:.15em .5em;border-radius:6px}
  .camno{position:absolute;top:6.5px;left:8.6px;width:1.75em;height:1.75em;border-radius:6px;
    display:grid;place-items:center;background:#cfe4ff;color:#08111c;font-weight:700;font-size:.95em}
  .cam figcaption{position:absolute;left:0;right:0;bottom:0;padding:6.5px 11.5px 7.6px;
    background:linear-gradient(transparent,rgba(5,9,14,.93) 60%);line-height:1.25}
  .cam figcaption b{display:block;font-size:1.08em;font-weight:650;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Platstexten får två rader — hela beskrivningen ska gå att läsa. */
  .cam figcaption em{font-style:normal;color:var(--muted);font-size:.9em;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  /* Inga mediafrågor: tavlan har fast format och skalas som en helhet,
     så den ser likadan ut i varje fönsterstorlek. */

  #setup{position:fixed;inset:0;background:rgba(6,9,13,.97);z-index:9999;padding:5vh 6vw;
    overflow:auto;font-size:1.15em;line-height:1.6}
  #setup h1{font-size:1.7em;margin:0 0 .6em}
  #setup code{background:#16202c;padding:.15em .45em;border-radius:5px;color:#9fd0ff}
  #setup ol{padding-left:1.4em} #setup li{margin:.5em 0}
  #setup a{color:var(--accent)}
  #dbg{position:fixed;right:1vw;bottom:1vh;max-width:46vw;max-height:62vh;overflow:auto;
    background:rgba(6,9,13,.96);border:1px solid var(--line);border-radius:10px;padding:10.8px 19.2px;
    font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fd0ff;z-index:9998;white-space:pre-wrap}
</style>
</head>
<body>

<!-- ==================================================================
     TOLLARE → STOCKHOLM · reseplanerare för DAKboard
     Data: Trafikverkets öppna API — TravelTimeRoute (restider) + Camera.
     Kartbakgrund: OpenStreetMap / CARTO.
     Fältnamn och filter är verifierade mot skarpa API-svar.
     ================================================================== -->

<div id="app">
  <header><div class="stamp" id="stamp">startar…</div></header>

  <main>
    <div class="col">
      <div id="dests" class="destwrap"></div>
      <div class="dest bus">
        <h2>Buss in mot stan<span class="km">SL, live</span></h2>
        <div id="buses"><div class="empty">hämtar avgångar…</div></div>
      </div>
    </div>
    <div class="col">
      <div class="banner warn" id="banner">
        <div class="dot"></div>
        <div>
          <div class="btitle" id="btitle">Hämtar trafikläget…</div>
          <div class="bmsg" id="bmsg">Södra länken · Värmdöleden 222</div>
        </div>
      </div>
      <div id="map"></div>
      <div class="panel" id="legpanel">
        <h3>Belastning per sträcka</h3>
        <div id="legs"><div class="empty">–</div></div>
      </div>
    </div>
  </main>

  <section class="cams" id="cams"><div class="empty">hämtar kameror…</div></section>
</div>

<script>
/* ==================================================================== *
 *  1. KONFIGURATION                                                     *
 * ==================================================================== */

const CONFIG = {

  /* Trafikverket-nyckel.
     LÄGG INTE NYCKELN HÄR om filen ligger i ett publikt repo — den blir
     läsbar för alla och bottar skannar GitHub efter nycklar.
     Skicka den i adressen istället, en gång räcker:
         https://…/index.html?key=DIN_NYCKEL
     Den sparas då i webbläsarens localStorage. Har du DAKboard-blockets
     URL med ?key=... i sig fungerar den vid varje omladdning. */
  apiKey: "",

  refreshSeconds: 90,
  reloadHours: 6,
  matchToleranceMeters: 700,
  staleMinutes: 8,

  home: { name: "Tollare, Nacka", lat: 59.3204, lon: 18.2090 },

  /* --- Karta ---------------------------------------------------------
     Kartan ritas som SVG direkt ur datan: Trafikverkets mätsträckor i sina
     köfärger, ledernas skisslinjer svagt streckade under, kamerorna
     numrerade och ortnamn för orientering. Ingen kartbild och inget
     externt bibliotek — det var det enda som kunde göra kartan osynlig.

     Utsnittet måste ha ungefär samma proportion som kartrutan, annars
     sträcks längden ut och allt hamnar i en klump i mitten.

     fitLegs styr utsnittet tillsammans med hemmapunkten och de visade
     kamerorna. De långa svansarna (E4 mot Södertälje, Huddingevägen och
     Vaxholmsgrenen) ritas men styr inte zoomen.
  ------------------------------------------------------------------- */
  map: {
    fitLegs: ["L222E","L222W","LSL","LE4LJ","LESS","LE4N","LCITY","LSOD","LSTG"],
    county: [[59.15,17.62],[59.42,18.24]],
    dynamicFit: true,
    padWhenExpanding: 0.012,

    /* Hur utsnittet väljs:
         "measured" – allt Trafikverket mäter i länet. Kartrutan är nästan
                      dubbelt så bred som hög, och pendlingskärnan är nästan
                      kvadratisk, så "legs" lämnar stora tomma fält. Med
                      "measured" fylls bredden av riktiga vägar istället.
         "legs"     – bara sträckorna i fitLegs. Mer inzoomat, men tomt i
                      kanterna.                                              */
    fitMode: "measured",

    /* Rita bara skisslinjer för de leder som hör till fitLegs. Färjegrenen
       mot Rindö–Vaxholm är raka streck över skärgården och såg ut som ett
       fel på kartan. */
    skeletonLegsOnly: true,

    /* Text nere till höger i kartan. */
    tileAttribution: "trafikdata Trafikverket",
    /* Ortnamn för orientering när kartbild saknas.
       [lat, lon, namn, dx, dy] — dx/dy i pixlar puttar texten bort från
       vägarna och kamerasiffrorna. Håll listan kort. */
    places: [
      [59.3204,18.2090,"Tollare",     10,  -4],
      [59.3095,18.1660,"Nacka",      -14,  14],
      [59.3195,18.0720,"Slussen",    -54, -14],
      [59.3055,18.0240,"Liljeholmen",-80,  -2],
      [59.2940,18.0400,"Årsta",      -16,  16],
      [59.3435,18.0100,"Karlberg",   -62,  -2],
      [59.3600,18.0250,"Solna",      -12, -16],
      [59.4030,17.9440,"Kista",      -36, -16],
      [59.4370,17.9330,"Häggvik",    -50,  -6],
      [59.2370,17.9820,"Huddinge",    10,  10],
      [59.1950,17.6420,"Södertälje",  10,  -4],
      [59.4030,17.8600,"Rinkeby",    -44, -16]
    ]
  },

  /* --- Leder ---------------------------------------------------------
     include = mönster mot Trafikverkets ruttnamn. Namnen bär RIKTNING:
       "75 V ..."  = väg 75 västerut (Södra länken in mot Årsta)
       "75 O ..."  = österut (hem mot Nacka)
       "E4/E20 N"  = norrut,  "E4/E20 S" = söderut
     Därför matchas bara den riktning du faktiskt kör. Utan det skulle
     motrikningens fria flöde späda ut morgonkön till hälften.
     km = verklig längd, styr hur kötid per km skalas.
     Leder utan include har ingen mätning (lokalgator) → visar normaltid.
  ------------------------------------------------------------------- */
  legs: {
    L222E: { name:"Värmdöleden 222 · Tollare–Nacka", short:"222", label:"Värmdöleden",
      freeFlow:6, km:4,
      include:/^222 V\b/,
      polyline:[[59.3200,18.2130],[59.3160,18.2050],[59.3130,18.1930],[59.3105,18.1800],[59.3095,18.1660]] },

    L222W: { name:"Värmdöleden 222 · Nacka–Danvikstull", short:"222v", label:"Värmdöleden v",
      freeFlow:6, km:4.5,
      include:/^222 V\b/,
      polyline:[[59.3095,18.1660],[59.3085,18.1500],[59.3085,18.1330],[59.3105,18.1180],[59.3140,18.1040]] },

    LSL:   { name:"Södra länken västerut (väg 75)", short:"SL", label:"Södra länken",
      freeFlow:6, km:8,
      include:/^75 V\b/,
      polyline:[[59.3085,18.1620],[59.3030,18.1420],[59.2975,18.1180],[59.2940,18.0930],
                [59.2925,18.0680],[59.2950,18.0480],[59.2942,18.0330],[59.2935,18.0100]] },

    LE4LJ: { name:"E4/E20 Västberga–Liljeholmen norrut", short:"E4", freeFlow:2, km:3,
      include:/^E4\/E20 N\b/,
      polyline:[[59.2935,18.0100],[59.2975,18.0080],[59.3015,18.0120],[59.3045,18.0200],[59.3058,18.0240]] },

    LESS:  { name:"Essingeleden norrut (E4/E20)", short:"Ess", label:"Essingeleden",
      freeFlow:5, km:6,
      include:/^E4\/E20 N\b/,

/* Trösklar för kvoten restid/fri restid. Kalibrerade mot skarpa data:
   nattetid ligger hela länet på 1.00–1.15, enstaka innerstadssträckor 1.4. */
const T = { flyter:1.15, trogt:1.40, kö:1.90 };

/* ==================================================================== *
 *  2. RENA HJÄLPFUNKTIONER                                              *
 * ==================================================================== */
// ==PURE-START==

function pickEntry(obj, names){
  if(!obj) return null;
  for(const n of names){
    const v = n.split(".").reduce((o,k)=> (o==null?o:o[k]), obj);
    if(v!==undefined && v!==null && v!=="") return { key:n, value:v };
  }
  return null;
}
function pickField(obj, names){ const e=pickEntry(obj,names); return e?e.value:undefined; }

/** WKT → lista av banor med [lat,lon] (WKT skriver lon lat). */
function parseWKT(wkt){
  if(typeof wkt!=="string") return [];
  const m = wkt.match(/^\s*([A-Z]+)\s*(?:Z|M|ZM)?\s*\((.*)\)\s*$/i);
  if(!m) return [];
  const type=m[1].toUpperCase(), body=m[2];
  const nums = s => s.trim().split(/\s*,\s*/).map(pair=>{
      const p=pair.replace(/^\(|\)$/g,"").trim().split(/\s+/).map(Number);
      return [p[1],p[0]];
    }).filter(c=> Number.isFinite(c[0]) && Number.isFinite(c[1]));
  if(type==="POINT"||type==="LINESTRING") return [nums(body)];
  if(type==="MULTIPOINT") return [nums(body.replace(/[()]/g,""))];
  if(type==="MULTILINESTRING"||type==="POLYGON")
    return (body.match(/\(([^()]*)\)/g)||[]).map(g=>nums(g.slice(1,-1))).filter(a=>a.length);
  return [];
}

/** Trafikverkets geometrier har upp till flera hundra punkter. Glesa ut
 *  dem — matchningen blir lika bra och kartan ritas långt snabbare. */
function thin(points, max){
  if(points.length<=max) return points.slice();
  const step=Math.ceil(points.length/max), out=[];
  for(let i=0;i<points.length;i+=step) out.push(points[i]);
  const last=points[points.length-1];
  if(out[out.length-1]!==last) out.push(last);
  return out;
}

const R_EARTH=6371000;
function metersBetween(a,b){
  const la=(a[0]+b[0])/2*Math.PI/180;
  return Math.hypot((b[1]-a[1])*Math.PI/180*Math.cos(la)*R_EARTH,
                    (b[0]-a[0])*Math.PI/180*R_EARTH);
}
function pathLengthMeters(path){
  let s=0; for(let i=1;i<path.length;i++) s+=metersBetween(path[i-1],path[i]); return s;
}
function pointToSegmentMeters(p,a,b){
  const la=a[0]*Math.PI/180, k=Math.cos(la)*R_EARTH*Math.PI/180, j=R_EARTH*Math.PI/180;
  const px=(p[1]-a[1])*k, py=(p[0]-a[0])*j, bx=(b[1]-a[1])*k, by=(b[0]-a[0])*j;
  const L2=bx*bx+by*by;
  if(L2===0) return Math.hypot(px,py);
  let t=(px*bx+py*by)/L2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-t*bx, py-t*by);
}
function pointToPathMeters(p,path){
  let best=Infinity;
  for(let i=1;i<path.length;i++) best=Math.min(best,pointToSegmentMeters(p,path[i-1],path[i]));
  return best;
}
function fractionNear(coords,path,tol){
  if(!coords.length||path.length<2) return 0;
  let hit=0; for(const c of coords) if(pointToPathMeters(c,path)<=tol) hit++;
  return hit/coords.length;
}

/** Läser ett TravelTimeRoute-objekt.
 *  Verifierade fältnamn (schemaversion 1.5): Id, Name, Length (m),
 *  TravelTime (s), FreeFlowTravelTime (s), Speed (km/h), TrafficStatus,
 *  MeasureTime, Geometry.WGS84. */
function readRoute(o){
  const name = pickField(o,["Name","RouteName","Description"]) || "okänd sträcka";
  const id   = String(pickField(o,["Id"]) ?? name);
  const paths = parseWKT(pickField(o,["Geometry.WGS84"])).map(p=>thin(p,40));
  const coords = thin(paths.flat(), 30);
  const len = Number(pickField(o,["Length","Distance","RouteLength"]));
  const distance = Number.isFinite(len)&&len>0 ? len
                 : (paths.reduce((s,p)=>s+pathLengthMeters(p),0) || null);
  const cur = Number(pickField(o,["TravelTime","CurrentTravelTime"]));
  const ref = Number(pickField(o,["FreeFlowTravelTime","ExpectedTravelTime"]));
  const speed = Number(pickField(o,["Speed"]));
  return {
    id, name, distance, coords, paths,
    cur: Number.isFinite(cur)&&cur>0 ? cur : null,
    ref: Number.isFinite(ref)&&ref>0 ? ref : null,
    speed: Number.isFinite(speed)&&speed>0 ? speed : null,
    status: String(pickField(o,["TrafficStatus"]) || "").toLowerCase(),
    measured: pickField(o,["MeasureTime","ModifiedTime"]),
    raw:o
  };
}

/** Kvot mot fri restid. 1.0 = normalt. */
function routeRatio(r){
  if(r.cur==null) return null;
  if(r.ref!=null) return r.cur/r.ref;
  if(r.distance){ return r.cur / (r.distance/(70/3.6)); }
  return null;
}

/** Trafikverkets egen statusflagga får bara HÖJA allvaret, aldrig sänka.
 *  Vokabulären är avläst ur skarpa svar: freeflow, heavy, congested,
 *  impossible. Tidigare föll congested och impossible ner till nivå 1 och
 *  underskattade läget. Regexen är kvar för värden jag inte sett. */
function statusFloor(status){
  if(!status || status==="freeflow" || status==="unknown") return 0;
  if(status==="heavy")      return 1;
  if(status==="congested")  return 2;
  if(status==="impossible") return 3;
  if(/stationary|stopped|stillast|impossible|blocked/.test(status)) return 3;
  if(/queu|kö|congest/.test(status)) return 2;
  return 1;
}
function levelFromRatio(ratio){
  if(ratio==null) return null;
  if(ratio<T.flyter) return 0;
  if(ratio<T.trogt)  return 1;
  if(ratio<T.kö)     return 2;
  return 3;
}

/** Vilka mätsträckor hör till leden? Namn (road + riktning) OCH geometri. */
function matchLeg(routes, leg, tol){
  if(!leg.include) return [];
  return routes.filter(r =>
    leg.include.test(r.name) &&
    r.coords.length &&
    fractionNear(r.coords, leg.polyline, tol) >= 0.5);
}

/** Kötid för en led. Viktas per km → tål överlappande mätsträckor. */
function legDelayMinutes(matched, legKm){
  let km=0, delayMin=0, speedNum=0, ratioNum=0, statusMax=0;
  for(const r of matched){
    const ratio=routeRatio(r);
    if(ratio==null || !r.distance) continue;
    const k=r.distance/1000;
    const refSec = r.ref!=null ? r.ref : r.cur/ratio;
    km += k;
    delayMin += Math.max(0, r.cur-refSec)/60;
    ratioNum += ratio*k;
    if(r.speed) speedNum += r.speed*k;
    statusMax = Math.max(statusMax, statusFloor(r.status));
  }
  if(km<=0) return { delay:0, coveredKm:0, ratio:null, speed:null, level:null };
  const ratio=ratioNum/km;
  // Nivån sätts på ledens längdviktade kvot, inte på den värsta delsträckan.
  // En enda kort ramp med skev referenstid ska inte stämpla hela leden som
  // stillastående. Trafikverkets egen status får däremot höja nivån.
  const level=Math.max(levelFromRatio(ratio), statusMax);
  return { delay:(delayMin/km)*legKm, coveredKm:km, ratio,
           speed: speedNum? speedNum/km : null, level };
}
// ==PURE-END==

async function tvQuery(objecttype, version, inner){
  const body = `<REQUEST><LOGIN authenticationkey="${apiKey}"/>`+
               `<QUERY objecttype="${objecttype}" schemaversion="${version}" limit="2000">`+
               `${inner}</QUERY></REQUEST>`;
  const res = await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/xml"},body});
  if(!res.ok) throw new Error(`HTTP ${res.status} (${objecttype})`);
  const json = await res.json();
  const r0 = json && json.RESPONSE && json.RESPONSE.RESULT && json.RESPONSE.RESULT[0];
  const err = r0 && r0.ERROR && (r0.ERROR.MESSAGE || r0.ERROR);
  if(err) throw new Error(String(err).slice(0,160));
  if(!r0)  throw new Error("tomt svar ("+objecttype+")");
  return r0[objecttype] || [];
}

async function fetchStopDepartures(stop){
  const url = `${SL_ENDPOINT}/${stop.id}/departures`+
              `?transport=${encodeURIComponent(CONFIG.buses.transport)}`+
              `&forecast=${CONFIG.buses.forecastMinutes}`;
  const res = await fetch(url);

  const j = await res.json();

/** Plockar ut det som ska visas ur SL:s svar.
 *  Punktlighet = expected − scheduled. OBS: SL sätter expected = scheduled
 *  för turer som ännu inte rullar, så diff 0 långt fram betyder "ingen
 *  prognos än" — inte "i tid". Därför kräver omdömet att avgången är nära. */
function readDepartures(stop, payload){
  const B=CONFIG.buses;
  let list=(payload && payload.departures) || [];
  if(B.inboundOnly){
    list=list.filter(d=>{
      if(Number(d.direction_code)===B.inboundDirectionCode) return true;
      // Riktningens namn, inte turens slutstation — kortvända turer räknas.
      return B.inboundPattern.test(String(d.direction||""));
    });
  }
  const deps=list.map(d=>{
    const sched=Date.parse(d.scheduled || "");
    const exp  =Date.parse(d.expected  || "");
    const t    =Number.isFinite(exp) ? exp : sched;
    const delay=(Number.isFinite(exp) && Number.isFinite(sched))
      ? Math.round((exp-sched)/60000) : null;
    const minutes=Number.isFinite(t) ? Math.round((t-Date.now())/60000) : null;
    const dest=d.destination || d.direction || "";
    const dir =d.direction || "";
    return {
      line: String((d.line&&d.line.designation) ?? "?"),
      to:   dest,
      // Kortvänd: turen slutar före riktningens ändstation.
      shortTurn: !!(dir && dest && dest!==dir),
      direction: dir,
      // Egna kolumner istället för SL:s display, som växlar mellan
      // "7 min" och "12:35" beroende på hur nära avgången ligger.
      countdown: minutes==null ? (d.display||"–")
               : minutes<=0 ? "Nu" : minutes+" min",
      // clock = beräknad avgång (SL:s prognos), schedClock = tidtabellen
      clock: Number.isFinite(t)
        ? two(new Date(t).getHours())+":"+two(new Date(t).getMinutes()) : "",
      schedClock: Number.isFinite(sched)
        ? two(new Date(sched).getHours())+":"+two(new Date(sched).getMinutes()) : "",
      // OBS: journey.id är inte unikt mellan linjer — samma id förekommer
      // på både 442 och 422. Nyckeln måste vara linje + tur.
      journeyId: (d.journey && d.journey.id!=null) ? String(d.journey.id) : null,
      minutes, delay,
      // Prognos finns om SL avviker från tabellen, eller om bussen är nära.
      live: delay!==null && (delay!==0 || (minutes!=null && minutes<=CONFIG.buses.forecastTrustMinutes)),
      cancelled: String(d.state||"").toUpperCase()==="CANCELLED",
      notes: (d.deviations||[]).map(x=>x.message).filter(Boolean)
    };
  }).sort((a,b)=>(a.minutes??1e9)-(b.minutes??1e9));
  return {
    // Hela hållplatsen förs vidare — short och primary tappades annars.
    ...stop,
    departures: deps,
    notes: ((payload&&payload.stop_deviations)||[]).map(x=>x.message).filter(Boolean)
  };
}

/** Samma buss passerar ofta flera av hållplatserna. Visa den bara vid den
 *  första i CONFIG.buses.stops — ordningen i listan är prioriteringen.
 *  Nyckeln är linje + tur: journey.id är inte unikt mellan linjer. */
function dedupeAcrossStops(stops){
  if(!CONFIG.buses.dedupeAcrossStops) return stops;
  const seen=new Set();
  return stops.map(s=>({
    ...s,
    departures: s.departures.filter(d=>{
      if(d.journeyId==null) return true;          // utan tur-id kan vi inte veta
      const key=d.line+"|"+d.journeyId;
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    })
  }));
}

/** Väntetid och nästa avgångar för en färjeled i vår färdriktning. */
function ferryWait(announcements, ferry){
  const now=Date.now();
  const times=(announcements||[])
    .filter(a=> a && a.Route && Number(a.Route.Id)===ferry.routeId)
    .filter(a=> !ferry.from || (a.FromHarbor && a.FromHarbor.Name===ferry.from))
    .map(a=> Date.parse(a.DepartureTime))
    .filter(t=> Number.isFinite(t) && t>=now-60000)
    .sort((a,b)=>a-b);
  if(!times.length) return { waitMin:null, next:[] };
  return { waitMin: Math.max(0,Math.round((times[0]-now)/60000)), next: times.slice(0,3) };
}

/* ---- kameror ------------------------------------------------------- */
function readCamera(o){
  const id   = String(pickField(o,["Id"]) ?? "");
  const url  = pickField(o,["PhotoUrl"]);
  const pt   = parseWKT(pickField(o,["Geometry.WGS84"])).flat()[0] || null;
  const status = String(pickField(o,["Status"]) || "");
  const off = v => v===false || v==="false";
  const on  = v => v===true  || v==="true";
  return {
    id, pt, photoUrl:url,
    name: pickField(o,["Name"]) || "",
    loc:  pickField(o,["Location"]) || "",
    type: pickField(o,["Type"]) || "",
    status,
    fullsize: pickField(o,["HasFullSizePhoto"]) !== false,
    direction: Number(pickField(o,["Direction"])),
    photoTime: pickField(o,["PhotoTime","ModifiedTime"]),
    // Utan PhotoUrl finns ingen bild att visa — Id går inte att bygga URL av.
    // data: tillåts för demolägets platshållarbilder.
    // Active/Deleted kontrolleras här också, inte bara i API-filtret: utan
    // det slank avställda kameror igenom så fort filtret inte användes.
    ok: !!(id && pt && url && /^(https?:\/\/|data:)/i.test(url)) &&
        (!status || /available/i.test(status)) &&
        !off(pickField(o,["Active"])) && !on(pickField(o,["Deleted"]))
  };
}
function cameraImageUrl(cam, fullsize){
  const url=String(cam.photoUrl||"");
  if(/^data:/i.test(url)) return url;              // platshållare i demoläget
  const base = url.split("?")[0];
  const stamp = Date.parse(cam.photoTime||"") || Date.now();
  return base+"?"+((fullsize && cam.fullsize!==false)?"type=fullsize&":"")+"maxage=1&_="+stamp;
}

/** Poängsätter kameror efter hur intressanta de är just nu. */
function scoreCameras(cams, legs, states, cfg){
  const out=[];
  for(const c of cams){
    if(!c.ok) continue;
    let leg=null, legDist=Infinity;
    for(const k in legs){
      const d=pointToPathMeters(c.pt, legs[k].polyline);
      if(d<legDist){ legDist=d; leg=k; }
    }
    if(!leg || legDist>cfg.maxDistanceMeters) continue;
    const st=states[leg]||{};
    let score = (st.delay||0)*5 + (st.level||0)*40;
    if((cfg.priorityLegs||[]).includes(leg)) score += 8;
    if(cfg.preferType && c.type===cfg.preferType) score += 6;
    score -= legDist/400;
    out.push({ ...c, leg, legDist, score });
  }
  out.sort((a,b)=> b.score-a.score || a.legDist-b.legDist);
  const per={}, chosen=[];
  for(const c of out){
    if((per[c.leg]||0)>=cfg.maxPerLeg) continue;
    per[c.leg]=(per[c.leg]||0)+1;
    chosen.push(c);
    if(chosen.length>=cfg.count) break;
  }
  return chosen;
}

/* ==================================================================== *
 *  5. KARTA                                                             *
 * ==================================================================== */
/* Egen SVG-renderare istället för Leaflet.
   Kartan är helt icke-interaktiv — ingen panorering, ingen zoom, inga
   kartbilder — så hela biblioteket behövdes bara för att projicera
   koordinater och rita linjer. Att hämta det från cdnjs var samtidigt det
   enda som kunde göra kartan osynlig när nätet strular. Nu finns inget
   externt beroende kvar i filen. */
let currentFit=null, mapBroken=false;

/** Utsnittet: normalt pendlingskärnan, utvidgat så att de visade kamerorna
 *  alltid ryms. Punkter utanför länet ignoreras. */
function computeFit(points){
  const M=CONFIG.map;
  const pts=[[CONFIG.home.lat,CONFIG.home.lon]];
  const extra=(points||[]).filter(Boolean);
  // I "measured" styr de ritade mätsträckorna utsnittet. Innan data kommit
  // in finns inga — då faller vi tillbaka på lederna.
  if(M.fitMode!=="measured" || extra.length<5){
    for(const k of (M.fitLegs||[])){
      const leg=CONFIG.legs[k];
      if(leg) for(const p of leg.polyline) pts.push(p);
    }
  }
  if(M.dynamicFit) for(const p of extra) pts.push(p);

  const [[cs,cw],[cn,ce]] = M.county;
  let s=90,w=180,n=-90,e=-180;
  for(const p of pts){
    if(p[0]<cs || p[0]>cn || p[1]<cw || p[1]>ce) continue;   // utanför länet
    s=Math.min(s,p[0]); n=Math.max(n,p[0]);
    w=Math.min(w,p[1]); e=Math.max(e,p[1]);
  }
  if(s>n || w>e) return M.county;
  const pad=M.padWhenExpanding||0.01;
  return [[s-pad,w-pad],[n+pad,e+pad]];
}

/* ---- projektion ---------------------------------------------------- *
   Web Mercator, samma som Leaflet använde. x är longitud i grader, y är
   den mercatorsträckta latituden. Vid 59°N är y-skalan nästan dubbel, så
   utan den ser Stockholm ihoptryckt ut.                                */
// ==MAP-PURE-START==
function mercY(lat){
  const r=Math.max(-85,Math.min(85,lat))*Math.PI/180;
  return Math.log(Math.tan(Math.PI/4+r/2))*180/Math.PI;
}
/** Skala och förskjutning som får bounds att fylla w×h px med marginal. */
function mapTransform(bounds,w,h,padPx){
  const [[s,west],[n,east]]=bounds;
  const x0=west, x1=east, y0=mercY(s), y1=mercY(n);
  const dx=Math.max(1e-9,x1-x0), dy=Math.max(1e-9,y1-y0);
  const iw=Math.max(1,w-2*padPx), ih=Math.max(1,h-2*padPx);
  const k=Math.min(iw/dx, ih/dy);                 // samma skala i båda led
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  return {
    k, w, h,
    px:(lat,lon)=>[ (lon-cx)*k + w/2, h/2 - (mercY(lat)-cy)*k ]
  };
}
// ==MAP-PURE-END==

const SVGNS="http://www.w3.org/2000/svg";
const mkSvg=(tag,attrs)=>{
  const e=document.createElementNS(SVGNS,tag);
  for(const a in attrs) if(attrs[a]!=null) e.setAttribute(a,String(attrs[a]));
  return e;
};
const pathOf=(coords,T)=>coords.map((p,i)=>{
  const [x,y]=T.px(p[0],p[1]);
  return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
}).join(" ");

/** Kameror står ofta tätt — ligger två på samma punkt blir siffrorna
 *  oläsliga. Knuffa undan de som krockar med en redan utsatt markör. */
function spreadPoints(points, minMeters){
  const out=[];
  for(const p of points){
    let q=[p[0],p[1]];
    for(let n=0; n<8; n++){
      if(!out.some(o=>metersBetween(o,q)<minMeters)) break;
      const ang=(n+1)*(Math.PI*2/5);
      const d=minMeters*0.85*(1+Math.floor(n/5));
      q=[ p[0] + (d*Math.sin(ang))/111320,
          p[1] + (d*Math.cos(ang))/(111320*Math.cos(p[0]*Math.PI/180)) ];
    }
    out.push(q);
  }
  return out;
}

function initMap(){ drawMap([],[]); }

/** Ritar hela kartan. Anropas vid varje uppdatering och vid omritning. */
function drawMap(routes, cams){
  const host=el("map");
  if(!host) return;
  const M=CONFIG.map;
  const w=host.clientWidth||960, h=host.clientHeight||420;

  const fitPts=(cams||[]).map(c=>c.pt).filter(Boolean);
  if(M.fitMode==="measured")
    for(const r of (routes||[])) for(const p of r.coords) fitPts.push(p);
  currentFit=computeFit(fitPts);
  const T=mapTransform(currentFit,w,h,10);

  const svg=mkSvg("svg",{width:w,height:h,viewBox:`0 0 ${w} ${h}`,class:"mapsvg"});

  // 1. ledernas skisslinjer, svagt streckade
  const skeleton = M.skeletonLegsOnly
    ? (M.fitLegs||[]).filter(k=>CONFIG.legs[k]) : Object.keys(CONFIG.legs);
  for(const k of skeleton)
    svg.appendChild(mkSvg("path",{d:pathOf(CONFIG.legs[k].polyline,T),
      fill:"none",stroke:"#2a3a4e","stroke-width":1.4,opacity:.28,"stroke-dasharray":"3 6"}));

  // 2. Trafikverkets mätsträckor i sina köfärger
  for(const r of (routes||[])){
    const ratio=routeRatio(r);
    const lvl=Math.max(levelFromRatio(ratio) ?? 0, statusFloor(r.status));
    const col=ratio==null ? C.none : LEVEL_COLOR[lvl];
    const sw=lvl>=2 ? 5.5 : lvl===1 ? 4 : 2.8;
    for(const p of r.paths){
      if(p.length<2) continue;
      svg.appendChild(mkSvg("path",{d:pathOf(p,T),fill:"none",stroke:col,
        "stroke-width":sw,"stroke-linecap":"round","stroke-linejoin":"round",
        opacity:ratio==null?.35:.95}));
    }
  }

  // 3. kamerorna, numrerade och isärknuffade
  const spread=spreadPoints((cams||[]).map(c=>c.pt).filter(Boolean),550);
  spread.forEach((pt,i)=>{
    const real=cams[i] && cams[i].pt;
    if(real && metersBetween(real,pt)>80)
      svg.appendChild(mkSvg("path",{d:pathOf([real,pt],T),fill:"none",
        stroke:"#cfe4ff","stroke-width":1,opacity:.45}));
    const [x,y]=T.px(pt[0],pt[1]);
    svg.appendChild(mkSvg("circle",{cx:x,cy:y,r:8,fill:"#cfe4ff",
      stroke:"#0a0e13","stroke-width":2}));
    const t=mkSvg("text",{x:x,y:y,class:"camnum","text-anchor":"middle",
      "dominant-baseline":"central"});
    t.textContent=String(i+1);
    svg.appendChild(t);
  });

  // 4. hemmapunkten
  const [hx,hy]=T.px(CONFIG.home.lat,CONFIG.home.lon);
  svg.appendChild(mkSvg("circle",{cx:hx,cy:hy,r:5,fill:"#4da3ff",
    stroke:"#ffffff","stroke-width":2}));

  // 5. ortnamn med sina pixeloffset
  for(const [lat,lon,label,dx,dy] of (M.places||[])){
    const [x,y]=T.px(lat,lon);
    if(x<-40||x>w+40||y<-20||y>h+20) continue;     // utanför rutan
    const t=mkSvg("text",{x:x+(dx??8),y:y+(dy??-4),class:"placelbl"});
    t.textContent=label;
    svg.appendChild(t);
  }

  // 6. källhänvisning
  const a=mkSvg("text",{x:w-6,y:h-6,class:"mapattr","text-anchor":"end"});
  a.textContent=M.tileAttribution||"trafikdata Trafikverket";
  svg.appendChild(a);

  host.replaceChildren(svg);
}

const el = id => document.getElementById(id);

/* ---- skalning ------------------------------------------------------ *
   Tavlan ritas i 1920×1080 och krymps till fönstret med transform.
   Allt inuti behåller sina proportioner, så inget kan huggas av eller
   försvinna — det blir bara mindre. Skalan går inte över 1: på en större
   skärm än designformatet centreras tavlan istället för att bli suddig.  */
const DESIGN_W=1920, DESIGN_H=1080;
function scaleBoard(){
  const app=el("app"); if(!app) return 1;
  const w=window.innerWidth||DESIGN_W, h=window.innerHeight||DESIGN_H;
  const s=Math.min(w/DESIGN_W, h/DESIGN_H, 1);
  // Centrera den skalade tavlan i fönstret. Översätt FÖRE skalning i
  // transformlistan, så att translate räknas i skärmpixlar.
  const ox=Math.round((w-DESIGN_W*s)/2), oy=Math.round((h-DESIGN_H*s)/2);
  app.style.transform="translate("+ox+"px,"+oy+"px) scale("+s.toFixed(4)+")";
  return s;
}

/** Tar bort rader underifrån tills innehållet ryms i sin ruta.
 *  Enda stället där verklig layouthöjd finns är i webbläsaren, så listorna
 *  anpassas efter rendering istället för att gissa antal rader i förväg.
 *  Halva avhuggna rader blir därmed aldrig kvar, och inget kort försvinner. */
function fitRows(host, selector, showNote){
  if(!host) return;
  const rows=()=>[...host.querySelectorAll(selector)];
  const fore=rows().length;              // renderade rader, inte totalt i datan
  let guard=0;
  while(host.scrollHeight>host.clientHeight+1 && rows().length>1 && guard++<80){
    rows().pop().remove();
  }
  const note=host.querySelector(".fitmore");
  if(note) note.remove();
  if(!showNote) return;
  const kapade=fore-rows().length;
  if(kapade<=0) return;
  // Notisen tar själv plats — ge den en rad genom att kapa en till.
  if(rows().length>1) rows().pop().remove();
  const n=document.createElement("div");
  n.className="busmore fitmore";
  n.textContent="+"+(fore-rows().length)+" fler";
  host.appendChild(n);
}

/** Anpassa listorna som kan bli för höga för sina rutor. */
function fitAll(){
  fitRows(el("buses"), ".busrow", true);
  fitRows(el("legs"),  ".legrow", false);
}
let legState={};

/* Avstängning: Trafikverkets avvikelsefeed (objekttypen Situation) finns
   INTE i detta API — bara mätdata. Därför bedöms avstängning ur mätningen:
   står trafiken still, eller har mätsträckorna på 75 V slutat rapportera
   fast de fanns tidigare, så beter sig leden som avstängd. Tavlan säger
   rakt ut att det är en bedömning och inte ett officiellt besked. */
let lslHadData=false, lslMissingRuns=0;

function closureVerdict(){
  const st=legState.LSL;
  if(!st) return { code:"unknown" };
  if(st.coveredKm>0){
    lslHadData=true; lslMissingRuns=0;
    if((st.level??0)>=3 || (st.speed!=null && st.speed<20)) return { code:"stopped", st };
    return { code:"open", st };
  }
  lslMissingRuns++;
  // Två tomma hämtningar i rad efter att data funnits = misstänkt avstängning.
  if(lslHadData && lslMissingRuns>=2) return { code:"nodata", st };
  return { code:"unknown", st };
}

function renderBanner(){
  const b=el("banner"), t=el("btitle"), m=el("bmsg");
  const watched=CONFIG.watch.legs.map(k=>({k,st:legState[k]})).filter(x=>x.st);
  const measured=watched.filter(x=>x.st.coveredKm>0);
  const delay=watched.reduce((s,x)=>s+(x.st.delay||0),0);
  const v=closureVerdict();

  let cls, title, note, caveat=true;
  if(v.code==="stopped"){
    cls="crit"; caveat=false;
    title="SÖDRA LÄNKEN: STÅR STILL – kan vara avstängt";
    note=Math.round(v.st.speed||0)+" km/h västerut · bedömt ur mätdata, inte officiellt besked";
  }else if(v.code==="nodata"){
    cls="crit"; caveat=false;
    title="SÖDRA LÄNKEN: ingen mätdata – kan vara avstängt";
    note="mätsträckorna på väg 75 västerut har slutat rapportera";
  }else if(v.code==="unknown"){
    cls="warn"; caveat=false;
    title="Södra länken: vet inte";
    note="ingen mätdata på väg 75 västerut ännu";
  }else{
    const lvl=v.st.level??0;
    cls=["ok","warn","bad","bad"][lvl];
    title="SÖDRA LÄNKEN: ÖPPEN · "+LEVEL_WORD[lvl]+" in mot stan";
    if(delay>=1) title+=" · +"+Math.round(delay)+" min";
    note = measured.map(x=>CONFIG.legs[x.k].short+" "+LEVEL_WORD[x.st.level??0]+
      (x.st.speed? " "+Math.round(x.st.speed)+" km/h":"")).join(" · ");
  }
  b.className="banner "+cls;
  t.textContent=title;
  // Förbehållet bara när läget ser normalt ut — vid larm står det i noten.
  m.textContent=note+(caveat?" · avstängning bedöms ur mätdata":"");
}

function renderDestinations(){
  const host=el("dests"); host.innerHTML="";
  for(const dest of CONFIG.destinations){
    // Ingen flex-grow: korten ska ha exakt den höjd innehållet kräver.
    const box=document.createElement("div"); box.className="dest";
    const rows=dest.routes.map(r=>{
      const legs=r.legs.map(k=>({key:k,cfg:CONFIG.legs[k],st:legState[k]||{}}));
      const free=legs.reduce((s,l)=>s+(l.cfg.freeFlow||0),0)+(r.extra||0);
      const delay=legs.reduce((s,l)=>s+(l.st.delay||0),0);
      const totKm=legs.reduce((s,l)=>s+l.cfg._km,0);
      const measKm=legs.reduce((s,l)=>s+(l.st.coveredKm?l.cfg._km:0),0);
      const noFerry=legs.some(l=>l.st.ferry && l.st.noService);
      return { ...r, legs, free, delay, eta:free+delay, noFerry,
               coverage: totKm? measKm/totKm : 0 };
    });
    const open=rows.filter(r=>!r.noFerry);
    const best=(open.length?open:rows).reduce((a,b)=> b.eta<a.eta?b:a);

    box.innerHTML=`<h2>${esc(dest.name)}<span class="km">från Tollare</span></h2>`;
    for(const r of rows){
      const div=document.createElement("div"); div.className="route";
      const chips=[];
      if(r.noFerry) chips.push(`<span class="chip blocked">INGEN FÄRJA</span>`);
      else if(best===r && rows.length>1) chips.push(`<span class="chip best">BÄST</span>`);
      // Saknas mätdata på en rejäl del av sträckan är siffran till stor del
      // beräknad — då ska den inte se lika säker ut som de andra.
      if(r.coverage<0.6) chips.push(`<span class="chip est" title="delvis beräknad – saknar mätdata på en del av sträckan">CA</span>`);
      div.innerHTML=
        `<div class="rname"><span class="txt">${esc(r.name)}</span>${chips.join("")}</div>`+
        `<div class="delta" style="color:${levelColor(levelFromRatio(1+r.delay/Math.max(r.free,1)))}">${fmtDelta(r.delay)}</div>`+
        `<div class="eta">${Math.round(r.eta)}<u>min</u></div>`+
        `<div class="legbar">`+
          r.legs.map(l=>{
            const st=l.st, has=st.coveredKm>0;
            const col = has ? levelColor(st.level) : C.none;
            const tip = l.cfg.name + (has
              ? " · "+(st.delay>=1 ? "+"+Math.round(st.delay)+" min" : LEVEL_WORD[st.level??0])
              : " · mäts inte av Trafikverket – restiden är beräknad");
            // Omätt markeras med diagonalstrecken och texten i title —
            // inget frågetecken i etiketten. label skrivs ut när sträckan
            // förtjänar sitt fulla namn, annars kortformen.
            const txt = l.cfg.label || l.cfg.short || "";
            // Texten i ett eget span så den kan huggas av med ellips om
            // fältet ändå blir för smalt — centrerad flextext klipps annars
            // mitt i ordet i båda ändar.
            return `<b class="${has?"":"nodata"}" style="flex:${l.cfg._km};background:${col}" `+
                   `title="${esc(tip)}"><span>${esc(txt)}</span></b>`;
          }).join("")+
        `</div>`;
      box.appendChild(div);
    }
    host.appendChild(box);
  }
}

function renderLegs(){
  const host=el("legs"); host.innerHTML="";
  const keys=Object.keys(CONFIG.legs)
    .filter(k=>legState[k])
    .sort((a,b)=> (legState[b].level??-1)-(legState[a].level??-1)
               || (legState[b].delay||0)-(legState[a].delay||0));
  // Alla leder renderas; fitRows kapar till det som ryms i panelen.
  for(const k of keys){
    const s=legState[k], cfg=CONFIG.legs[k];
    const has=s.coveredKm>0;
    const col=has?levelColor(s.level):C.none;
    const row=document.createElement("div"); row.className="legrow";
    const hhmm=t=>{const d=new Date(t);return two(d.getHours())+":"+two(d.getMinutes());};
    const mid = s.ferry
      ? (s.noService ? "inga fler avgångar"
                     : "avg "+s.departures.map(hhmm).join(", "))
      : (has ? Math.round(s.speed||0)+" km/h · "+
               Math.round(Math.min(s.coveredKm,cfg._km))+"/"+Math.round(cfg._km)+" km mätt"
             : "mäts inte");
    const right = s.ferry
      ? (s.noService ? "–" : (s.delay>=1 ? Math.round(s.delay)+" min väntan" : "avgår nu"))
      : (has ? (s.delay>=1 ? "+"+Math.round(s.delay)+" min" : LEVEL_WORD[s.level]) : "–");
    row.innerHTML=
      `<span class="pill" style="background:${col}"></span>`+
      `<span class="nm">${esc(cfg.name)}</span>`+
      `<span class="now">${esc(mid)}</span>`+
      `<span class="dl" style="color:${col}">${esc(right)}</span>`;
    host.appendChild(row);
  }
  if(!keys.length) host.innerHTML=`<div class="empty">ingen mätdata</div>`;

  // Säg tydligt hur många sträckor som inte mäts alls — de streckade
  // fälten i ruttstaplarna är dessa.
  const utan=keys.filter(k=>!(legState[k].coveredKm>0)).length;
  const h3=document.querySelector("#legpanel h3");
  if(h3) h3.textContent = "Belastning per sträcka"+(utan? " · "+utan+" mäts inte" : "");
}

/** Punktlighetstexten för en avgång. */
function punctuality(d){
  const late=CONFIG.buses.lateMinutes;
  if(d.cancelled) return { text:"", cls:"" };
  if(!d.live)     return { text:"tidtabell", cls:"plan",
                           tip:"ingen realtidsprognos än – bussen har inte startat" };
  if(d.delay>=late)  return { text:"+"+d.delay+" min", cls:d.delay>=5?"bad":"warn",
                              tip:"försenad mot tidtabell" };
  if(d.delay<=-late) return { text:d.delay+" min", cls:"early", tip:"före tidtabell" };
  return { text:"i tid", cls:"ontime" };
}

/** En avgångsrad. `stopLabel` sätts bara i den kronologiska listan. */
function busRow(d, stopLabel, primary){
  const row=document.createElement("div");
  row.className="busrow"+(d.cancelled?" cancelled":"")+(primary?" prim":"");
  const soon = d.minutes!=null && d.minutes<=CONFIG.buses.soonMinutes;
  const p=punctuality(d);
  row.innerHTML=
    `<span class="ln">${esc(d.line)}</span>`+
    `<span class="to">${esc(d.to)}`+
      (d.shortTurn?' <u title="kortvänd tur – går inte hela vägen till '+
        esc(d.direction)+'">kort</u>':"")+
      (d.notes.length?' <i title="'+esc(d.notes.join(" · "))+'">!</i>':"")+
    `</span>`+
    (stopLabel!=null ? `<span class="hpl">${esc(stopLabel)}</span>` : "")+
    `<span class="pt ${p.cls}"${p.tip?' title="'+esc(p.tip)+'"':""}>${esc(p.text)}</span>`+
    // Beräknad avgång stort, tidtabellen liten under. Nedräkningen i
    // minuter låg här tidigare men klockslaget är det man planerar efter.
    `<span class="clock${soon?" soon":""}"`+
      (d.countdown?` title="om ${esc(d.countdown)}"`:"")+`>`+
      `<b>${d.cancelled?"inställd":esc(d.clock)}</b>`+
      (d.schedClock?`<em title="enligt tidtabell">${esc(d.schedClock)}</em>`:"")+
      `</span>`;
  return row;
}

function renderBuses(stops){
  const host=el("buses"); if(!host) return;
  host.innerHTML="";
  if(!stops.length){ host.innerHTML=`<div class="empty">inga avgångar</div>`; return; }

  if(!CONFIG.buses.groupByStop){
    // Alla hållplatser i en kronologisk lista.
    const all=[];
    for(const s of stops)
      for(const d of s.departures)
        all.push({ d, label:s.short||s.name, primary:!!s.primary });
    all.sort((a,b)=>(a.d.minutes??1e9)-(b.d.minutes??1e9));
    if(!all.length){ host.innerHTML=`<div class="empty">inga avgångar mot stan</div>`; return; }
    host.classList.add("merged");
    // Rendera upp till maxRows och låt fitRows() kapa till det som ryms.
    for(const x of all.slice(0,CONFIG.buses.maxRows))
      host.appendChild(busRow(x.d, x.label, x.primary));
    return;
  }

  host.classList.remove("merged");
  for(const s of stops){
    const h=document.createElement("div"); h.className="bustop";
    h.textContent=s.name;
    host.appendChild(h);
    const shown=s.departures.slice(0,CONFIG.buses.perStop);
    if(!shown.length){
      const e=document.createElement("div"); e.className="empty";
      e.textContent="inga avgångar inom "+CONFIG.buses.forecastMinutes+" min";
      host.appendChild(e); continue;
    }
    for(const d of shown) host.appendChild(busRow(d, null, !!s.primary));
    if(s.departures.length>shown.length){
      const more=document.createElement("div"); more.className="busmore";
      more.textContent="+"+(s.departures.length-shown.length)+" fler";
      host.appendChild(more);
    }
  }
}

function renderCameras(list){
  const host=el("cams"); host.innerHTML="";
  if(!list.length){ host.innerHTML=`<div class="empty">inga kameror nära dina leder</div>`; return; }
  list.forEach((c,i)=>{
    const st=legState[c.leg]||{};
    const has=st.coveredKm>0;
    const col=has?levelColor(st.level):C.none;
    const tag=(CONFIG.legs[c.leg].short||"")+" · "+(has
      ? (st.delay>=1? "+"+Math.round(st.delay)+" min" : LEVEL_WORD[st.level??0])
      : "mäts inte");
    const age=minutesAgo(c.photoTime);

    const fig=document.createElement("figure"); fig.className="cam";
    const img=document.createElement("img");
    img.alt=c.name||"trafikkamera";
    // INTE loading="lazy": i DAKboards iframe kan bilden räknas som utanför
    // skärmen och då laddas den aldrig.
    img.setAttribute("decoding","async");
    img.setAttribute("referrerpolicy","no-referrer");
    let retried=false;
    img.addEventListener("error",()=>{
      if(retried){ fig.classList.add("dead"); return; }
      retried=true;
      setTimeout(()=>{ img.src=cameraImageUrl(c,CONFIG.cameras.fullsize); },4000);
    });
    img.addEventListener("load",()=>fig.classList.remove("dead"));
    img.src=cameraImageUrl(c,CONFIG.cameras.fullsize);

    const tagEl=document.createElement("span");
    tagEl.className="camtag"; tagEl.style.background=col; tagEl.textContent=tag;
    const no=document.createElement("span");
    no.className="camno"; no.textContent=String(i+1);
    const cap=document.createElement("figcaption");
    cap.innerHTML=`<b>${esc(c.name||"kamera")}</b><em>${esc(shortLoc(c.loc))}`+
      `${age!=null? " · "+age+" min":""}</em>`;

    fig.append(img,no,tagEl,cap);
    host.appendChild(fig);
  });
}

/* ==================================================================== *
 *  7. DEMOLÄGE (?mock=1)                                                *
 * ==================================================================== */
/** Platshållarbild till demoläget — en vägbild i grova drag, som data-URI
 *  så att demot inte behöver nätet. */
function mockImage(label){
  const svg =
    `<svg xmlns='http://www.w3.org/2000/svg' width='480' height='270'>`+
    `<rect width='480' height='270' fill='#16202c'/>`+
    `<path d='M0 270 L200 120 L280 120 L480 270 Z' fill='#1e2a38'/>`+
    `<path d='M240 120 L240 270' stroke='#3a4a5e' stroke-width='3' stroke-dasharray='14 12'/>`+
    `<path d='M205 120 L60 270' stroke='#2b3a4d' stroke-width='2'/>`+
    `<path d='M275 120 L420 270' stroke='#2b3a4d' stroke-width='2'/>`+
    `<rect x='150' y='190' width='34' height='20' rx='4' fill='#4a5c73'/>`+
    `<rect x='300' y='215' width='40' height='24' rx='4' fill='#4a5c73'/>`+
    `<rect x='255' y='150' width='24' height='14' rx='3' fill='#3d4d62'/>`+
    `<rect width='480' height='270' fill='none' stroke='#233043'/>`+
    `<text x='240' y='40' fill='#5b6b80' font-family='sans-serif' font-size='18'`+
    ` text-anchor='middle'>demobild · ${label}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

function mockData(){
  const rnd=(s=>()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff)(20260910);
  const load={ LSL:2.4, L222E:1.3, L222W:1.5, LESS:1.7, LCITY:1.9,
               LE4LJ:1.1, LE4N:1.4, LE4S:1.1, L226:1.02 };
  const prefix={ LSL:"75 V ", L222E:"222 V ", L222W:"222 V ", LESS:"E4/E20 N ",
                 LE4LJ:"E4/E20 N ", LE4N:"E4 N ", LE4S:"E4/E20 S ",
                 L226:"226 S ", LCITY:"Nord-Sydaxeln N " };
  const routes=[], cams=[];
  for(const k in CONFIG.legs){
    const p=CONFIG.legs[k].polyline;
    for(let i=1;i<p.length;i++){
      if(prefix[k]){
        const dist=Math.max(400,metersBetween(p[i-1],p[i]));
        const ref=dist/(80/3.6), f=(load[k]||1.1)*(0.85+0.3*rnd());
        routes.push({ Id:k+"-"+i, Name:prefix[k]+"delsträcka "+i, Length:Math.round(dist),
          FreeFlowTravelTime:+ref.toFixed(1), TravelTime:+(ref*f).toFixed(1),
          Speed:+(dist/(ref*f)*3.6).toFixed(1),
          TrafficStatus: f>2 ? "heavy" : "freeflow",
          MeasureTime:new Date().toISOString(),
          Geometry:{WGS84:`LINESTRING (${p[i-1][1]} ${p[i-1][0]}, ${p[i][1]} ${p[i][0]})`} });
      }
      if(i%2===1){
        const mid=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];
        cams.push({ Id:"SE_STA_CAMERA_Mock_"+k+i, Name:CONFIG.legs[k].short+" "+i,
          Location:"Kameran är placerad på "+CONFIG.legs[k].name.split("·")[0].trim()+
                   " och är riktad mot Stockholm.",
          Type:"Trafikflödeskamera", Status:"videoOrImagesAvailable", HasFullSizePhoto:true,
          PhotoTime:new Date(Date.now()-(2+i)*60000).toISOString(),
          PhotoUrl:mockImage(CONFIG.legs[k].short+" "+i),
          Geometry:{WGS84:`POINT (${mid[1]} ${mid[0]})`} });
      }
    }
  }
  cams.push({ Id:"utan_url", Name:"Utan bild", Status:"videoOrImagesAvailable",
              Geometry:{WGS84:"POINT (18.07 59.32)"} });

  // färjeavgångar var 20:e minut på båda lederna
  const ferries=[];
  for(const [routeId,from,to,name] of [[17,"Värmdö","Rindö","Oxdjupsleden"],
                                       [21,"Rindö","Vaxholm","Vaxholmsleden"]]){
    for(let i=0;i<4;i++)
      ferries.push({ DepartureTime:new Date(Date.now()+(6+i*20)*60000).toISOString(),
        FromHarbor:{Name:from}, ToHarbor:{Name:to}, Route:{Id:routeId,Name:name} });
  }
  // bussavgångar i SL:s format
  // ett av varje punktlighetsläge: sen, i tid, tidig, utan prognos, inställd
  const fall=[ {min:3,  dly:4},  {min:8,  dly:0},  {min:12, dly:7},
               {min:17, dly:-3}, {min:26, dly:0, cancel:true},
               {min:38, dly:0},  {min:47, dly:0} ];
  // Varje hållplats har egna turer — tidigare låtsades demot att samma buss
  // gick från alla tre, vilket gav falska dubbletter.
  const linjer=["414","442","445"];
  const mkDep=(min,dly,journeyId,line,opts)=>{
    const exp=new Date(Date.now()+min*60000);
    const sched=new Date(exp.getTime()-dly*60000);
    const o=opts||{};
    return { line:{designation:line}, journey:{id:journeyId},
      direction: o.outbound ? "Orminge centrum" : "Slussen",
      direction_code: o.outbound ? 1 : 2,
      destination: o.outbound ? "Orminge centrum" : (o.shortTurn ? "Nacka Forum" : "Slussen"),
      scheduled:sched.toISOString(), expected:exp.toISOString(),
      state: o.cancel ? "CANCELLED":"EXPECTED",
      deviations: o.note ? [{message:"Hållplatsen är tillfälligt flyttad"}] : [] };
  };
  const busPayloads=CONFIG.buses.stops.map((s,si)=>{
    const line=linjer[si%linjer.length];
    const departures=fall.map((c,i)=>
      mkDep(c.min+si*3, c.dly, 900000+si*100+i, line, {
        outbound: i===0 || i===4,
        shortTurn: i===2,
        cancel: c.cancel,
        note: i===1
      }));
    // En tur som redan visats vid hållplats 1 — ska filtreras bort här.
    if(si>0) departures.push(mkDep(9+si*6, 0, 900000+1, linjer[0], {}));
    return { departures, stop_deviations:[] };
  });
  return { routes, cams, ferries, busPayloads };
}

/* ==================================================================== *
 *  8. HUVUDLOOP                                                         *
 * ==================================================================== */
let lastGood=null, lastError=null, knownCameras=[], busStops=[];
let lastRoutes=[], lastCams=[];

function computeLegLengths(){
  for(const k in CONFIG.legs){
    const c=CONFIG.legs[k];
    c._km = c.km || pathLengthMeters(c.polyline)/1000;
  }
}

async function refresh(){
  let routes=[], ferries=[], errs=[];
  if(MOCK){
    const m=mockData();
    routes=m.routes.map(readRoute);
    ferries=m.ferries;
    knownCameras=m.cams.map(readCamera).filter(c=>c.ok);
    busStops=dedupeAcrossStops(CONFIG.buses.stops.map((s,i)=>readDepartures(s,m.busPayloads[i])));
  }else{
    try{ routes=(await fetchRoutes()).map(readRoute); }
    catch(e){ errs.push("restider: "+e.message); }
    try{
      const cams=(await fetchCameras()).map(readCamera).filter(c=>c.ok);
      if(cams.length) knownCameras=cams;          // behåll förra listan vid fel
    }catch(e){ errs.push("kameror: "+e.message); }
    if(ferryRouteIds().length){
      try{ ferries=await fetchFerries(); }
      catch(e){ errs.push("färjor: "+e.message); }
    }
    // Bussarna är en egen tjänst (SL) — faller de bort ska resten stå kvar.
    const got=await Promise.all((CONFIG.buses.stops||[]).map(s=>
      fetchStopDepartures(s).catch(e=>{ errs.push("buss "+s.name+": "+e.message); return null; })));
    const ok=got.filter(Boolean);
    if(ok.length) busStops=dedupeAcrossStops(ok);
  }

  // Bara om ingenting alls gick igenom är det läge att ge upp rundan.
  if(errs.length && !routes.length && !busStops.length){
    lastError=errs.join(" · "); updateStamp(); return;
  }
  lastError = errs.length ? errs.join(" · ") : null;

  legState={};
  for(const k in CONFIG.legs){
    const cfg=CONFIG.legs[k];
    if(cfg.ferry){
      // Färja: "kötiden" är väntan på nästa avgång.
      const w=ferryWait(ferries,cfg.ferry);
      legState[k]={ name:cfg.name, matched:0, ferry:true, departures:w.next,
        delay: w.waitMin ?? 0,
        coveredKm: w.waitMin==null ? 0 : cfg._km,
        level: w.waitMin==null ? null : (w.waitMin<10 ? 0 : w.waitMin<25 ? 1 : 2),
        ratio:null, speed:null, noService: w.waitMin==null };
      continue;
    }
    const matched=matchLeg(routes,cfg,CONFIG.matchToleranceMeters);
    legState[k]={ name:cfg.name, matched:matched.length, ...legDelayMinutes(matched,cfg._km) };
  }

  const cams=scoreCameras(knownCameras,CONFIG.legs,legState,CONFIG.cameras);

  // Utsnittet: kamerorna alltid, och i "measured" även allt Trafikverket
  // mäter — annars blev halva kartrutan tom.
  lastRoutes=routes; lastCams=cams;
  if(!mapBroken) drawMap(routes, cams);
  renderBanner(); renderDestinations(); renderLegs();
  renderBuses(busStops); renderCameras(cams);
  // Först efter att webbläsaren räknat om layouten vet vi vad som ryms.
  requestAnimationFrame(fitAll);

  lastGood=new Date();
  updateStamp();
  if(DEBUG) showDebug(routes,cams);
}

function updateStamp(){
  const st=el("stamp");
  if(!lastGood && lastError){ st.innerHTML=`<span class="err">fel: ${esc(lastError)}</span>`; return; }
  if(!lastGood){ st.textContent="hämtar…"; return; }
  const ageMin=(Date.now()-lastGood.getTime())/60000;
  const stale=ageMin>CONFIG.staleMinutes;
  // Bara uppdateringstiden. Fel och demoläge visas ändå — utan det vet man
  // inte att siffrorna står still.
  st.innerHTML =
    `<b class="${stale?"stale":""}">uppdaterad ${two(lastGood.getHours())}:${two(lastGood.getMinutes())}`+
    `${stale?" ("+Math.round(ageMin)+" min sedan)":""}</b>`+
    (lastError ? `<br><span class="err">${esc(lastError)}</span>` : "")+
    (MOCK ? `<br><span class="stale">DEMOLÄGE · påhittad data</span>` : "");
}

function showSetup(){
  const d=document.createElement("div"); d.id="setup";
  d.innerHTML=`<h1>Trafikverket-nyckel saknas</h1>
    <ol>
      <li>Hämta en gratisnyckel på <a href="https://data.trafikverket.se/">data.trafikverket.se</a>.</li>
      <li>Lägg den i adressen: <code>${esc(location.pathname)}?key=DIN_NYCKEL</code><br>
          Den sparas i webbläsaren, så det räcker en gång per skärm.</li>
    </ol>
    <p style="color:#8497ad">Ligger filen i ett publikt repo: skriv inte nyckeln i
       <code>index.html</code>. Håll den i DAKboard-blockets URL istället.</p>
    <p>Vill du bara se layouten: <code>${esc(location.pathname)}?mock=1</code></p>`;
  document.body.appendChild(d);
}

function showDebug(routes,cams){
  let box=el("dbg");
  if(!box){ box=document.createElement("div"); box.id="dbg"; document.body.appendChild(box); }
  const r0=routes[0];
  box.textContent =
    `TravelTimeRoute: ${routes.length} sträckor i Stockholms län\n`+
    `fält i svaret: ${r0? Object.keys(r0.raw).join(", "):"–"}\n`+
    `exempel: ${r0? r0.name+"  "+r0.cur+"s / "+r0.ref+"s fri  "+r0.distance+"m  "+r0.speed+"km/h  "+r0.status : "–"}\n\n`+
    `Kameror: ${knownCameras.length} användbara, ${cams.length} visas\n`+
    `${cams[0]? "bildurl: "+cameraImageUrl(cams[0],CONFIG.cameras.fullsize) : ""}\n\n`+
    `leder (namnmatchning + geometri):\n`+
    Object.keys(CONFIG.legs).map(k=>{
      const s=legState[k], c=CONFIG.legs[k];
      return `  ${k.padEnd(6)} ${String(s.matched).padStart(2)} rutter  `+
             `${s.coveredKm.toFixed(1)}/${c._km} km  +${s.delay.toFixed(1)} min  `+
             `${s.ratio? "×"+s.ratio.toFixed(2):"–"}`;
    }).join("\n");
}

/* ---- start ---- */
computeLegLengths();
scaleBoard();
// Kartan får inte kunna fälla resten av tavlan.
try{ initMap(); }
catch(e){
  mapBroken=true;
  el("map").innerHTML=`<div class="maperr">Kartan kunde inte ritas<br><small>`+
    esc(e.message)+`</small></div>`;
}
renderDestinations(); renderLegs();

// Ändrad fönsterstorlek ger en ny höjdbudget — rendera om och anpassa
// antalet rader efter den.
let fitTimer=null;
window.addEventListener("resize",()=>{
  scaleBoard();                       // omedelbart, så inget hoppar
  clearTimeout(fitTimer);
  fitTimer=setTimeout(fitAll,250);    // radantalet är oförändrat, men billigt
});

if(!MOCK && !apiKey){
  showSetup();
}else{
  refresh();
  setInterval(refresh, CONFIG.refreshSeconds*1000);
  setInterval(updateStamp, 30000);
  setTimeout(()=>location.reload(), CONFIG.reloadHours*3600*1000);
}
</script>
